<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex" />
  <title>Sheet not found — Daniil Zinoviev</title>
  <style>
    :root { --bg:#e7ebe9; --ink:#101820; --muted:#56616b; --accent:#1f3bd6; --grid:rgba(16,24,32,.075); }
    @media (prefers-color-scheme: dark) { :root { --bg:#0c1b2a; --ink:#e6ecf1; --muted:#93a3b3; --accent:#8db1ff; --grid:rgba(230,236,241,.07); } }
    body { margin:0; min-height:100svh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:"Geist","Helvetica Neue",Arial,sans-serif;
      background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:48px 48px; }
    main { padding:40px; max-width:60ch; }
    p.label { font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 20px; }
    h1 { font-family:"Archivo","Helvetica Neue",Arial,sans-serif; font-weight:500; font-size:clamp(36px,6vw,80px); line-height:.95; letter-spacing:-.03em; margin:0 0 24px; }
    a { display:inline-block; padding:13px 18px; border:1px solid var(--ink); color:inherit; text-decoration:none; font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    a:hover, a:focus-visible { background:var(--ink); color:var(--bg); outline:none; }
  </style>
</head>
<body><main><p class="label">404</p><h1>This sheet is not in the set.</h1><a href="./">Back to the index</a></main></body>
</html>
